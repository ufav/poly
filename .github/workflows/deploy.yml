name: deploy platform

on:
  push:
    branches: [main]
    paths:
      - "pmbot/**"
      - "core/**"
      - "data_engine/**"
      - "workers/**"
      - "migrations/**"
      - "requirements-platform.txt"
      - "scripts/**"
      - "!scripts/research/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: pull and rebuild on the server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/polymarket
            echo "deploy as $(whoami) in $PWD"
            grep -q '^POSTGRES_PASSWORD=' .env || { echo "POSTGRES_PASSWORD missing in $PWD/.env"; exit 1; }
            git pull --ff-only
            docker compose up -d --build --remove-orphans  # postgres + worker
            docker image prune -f --filter label=app=sports-platform
            docker compose ps
