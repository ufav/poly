name: deploy paper bot

on:
  push:
    branches: [main]
    paths:
      - "pmbot/**"
      - "core/**"
      - "data_engine/**"
      - "workers/**"
      - "migrations/**"
      - "requirements-platform.txt"
      - "scripts/**"
      - "!scripts/research/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: pull and rebuild on the server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/polymarket
            git pull --ff-only
            docker compose up -d --build  # platform: postgres + worker
            if [ -f .paper-running ]; then  # paper bots (profile "paper") only when started via "paper bots control"
              docker compose --profile paper up -d --build
            fi
            docker image prune -f --filter label=app=polymarket-paper-bot
            docker compose ps
