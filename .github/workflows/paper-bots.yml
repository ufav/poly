name: paper bots control

# Manual: Actions -> "paper bots control" -> Run workflow. The paper bots are the compose profile "paper"; start
# leaves ~/polymarket/.paper-running so that deploys keep them up, stop removes it (data and banks are kept).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "stop / start / status"
        type: choice
        options: [status, stop, start]
        default: status
      service:
        description: "bot (all = every paper bot)"
        type: choice
        options: [all, paper-bot, paper-bot-dota, paper-bot-tennis]
        default: all

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: ${{ inputs.action }} ${{ inputs.service }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ~/polymarket
            svc="${{ inputs.service }}"
            [ "$svc" = "all" ] && svc="" || true
            case "${{ inputs.action }}" in
              stop)
                docker compose --profile paper stop $svc
                [ -z "$svc" ] && rm -f .paper-running || true
                ;;
              start)
                touch .paper-running
                docker compose --profile paper up -d $svc
                ;;
            esac
            docker compose --profile paper ps -a
            [ -f .paper-running ] && echo "paper bots: deploys keep them running" || echo "paper bots: off for deploys"
