services:
  paper-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # override old .env lists (no comebacks/maker/late); filters in paper.py R-26
      PAPER_RULES: leader_half,leader_half6,fav_band_t1
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Dota 2: map 1 loser on map 2 (docs/research.md R-20), own database data/live_dota2.sqlite and banks
  paper-bot-dota:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PAPER_SPORT: dota2
      PAPER_STAKE_PCT: "1"
      PAPER_RULES: ""
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Tennis: fav after own set 1, entry odds ~1.10–1.30 (R-23b / R-27)
  paper-bot-tennis:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PAPER_SPORT: tennis
      PAPER_STAKE_PCT: "1"
      PAPER_RULES: tennis_fav_s1
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
