services:
  paper-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # no comebacks/maker/late; no prematch/entry odds band (T-25); dog_slow_fav = R-29 (T-27)
      PAPER_RULES: leader_half,leader_half6,fav_band_t1,dog_slow_fav
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Dota 2: map 1 loser on map 2 (docs/research.md R-20), own database data/live_dota2.sqlite and banks
  paper-bot-dota:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PAPER_SPORT: dota2
      PAPER_STAKE_PCT: "1"
      PAPER_RULES: ""
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Tennis: buy set-1 winner on moneyline (R-23b) — all three banks
  paper-bot-tennis:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PAPER_SPORT: tennis
      PAPER_STAKE_PCT: "1"
      PAPER_RULES: ""
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
