x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Sports analytics platform (docs/md1.md). The old Polymarket paper bots are frozen: their code stays in the repo
# (pmbot/live, scripts/paper_bot.py, compose services in git history), they are not deployed.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sports
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=32MB", "-c", "maintenance_work_mem=256MB"]
    volumes:
      # data on the host, outside the project and docker volumes: survives container removal / rebuild / down -v
      - ${PGDATA_DIR:-/srv/sports/pgdata}:/var/lib/postgresql/data
      - ${PGBACKUP_DIR:-/srv/sports/backups}:/backups
    ports:
      - "127.0.0.1:5432:5432"   # local only: ssh tunnel for analysis from a workstation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d sports"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # scheduled jobs (workers/scheduler.py): Olimpbet results daily, later Polymarket prices and the rest
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sa:${POSTGRES_PASSWORD}@postgres:5432/sports
    command: ["python", "-u", "-m", "workers.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    logging: *logging
